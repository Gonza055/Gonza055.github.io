<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">SIC decision support workflow</title>
<desc id="desc">A shift deviation is detected, reviewed through a role-based workflow, and converted into an implemented operational action with traceability.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#212A31"/><stop offset=".65" stop-color="#31404A"/><stop offset="1" stop-color="#425563"/>
  </linearGradient>
  <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#839BAC" stop-opacity=".35"/><stop offset="1" stop-color="#212A31" stop-opacity=".05"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
  </filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<path d="M0 350L120 310 220 330 350 280 470 320 590 265 720 310 845 275 980 320 1100 292 1200 312V675H0Z" fill="url(#mine)"/>
<path d="M0 422c160-34 290-13 423 12 155 29 312 20 465-14 125-28 216-28 312-4" fill="none" stroke="#D6DEE3" stroke-opacity=".18" stroke-width="3"/>
<text x="52" y="58" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#E84B37">SIC</text>
<text x="105" y="58" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">DECISION SUPPORT</text>

<!-- deviation -->
<g filter="url(#shadow)">
  <rect x="48" y="116" width="300" height="430" rx="18" fill="#FFFFFF" stroke="#E84B37" stroke-width="3"/>
</g>
<rect x="70" y="142" width="64" height="64" rx="12" fill="#FFF0ED"/>
<path d="M102 155l27 44H75Z" fill="#E84B37"/>
<rect x="99" y="169" width="6" height="17" rx="3" fill="#fff"/><circle cx="102" cy="192" r="3" fill="#fff"/>
<text x="152" y="168" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#212A31">Shift deviation</text>
<text x="152" y="194" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425563">Truck cycle time above target</text>

<rect x="70" y="230" width="256" height="156" rx="12" fill="#F2F2F2"/>
<line x1="88" y1="352" x2="306" y2="352" stroke="#B1BCC8"/>
<line x1="88" y1="276" x2="306" y2="276" stroke="#E84B37" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M90 335L118 323 146 329 174 312 202 318 230 290 258 301 286 270 306 276" fill="none" stroke="#E84B37" stroke-width="5"/>
<circle cx="286" cy="270" r="8" fill="#E84B37"/>
<text x="88" y="414" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="900" fill="#E84B37">+32%</text>
<text x="186" y="414" font-family="Inter,Arial,sans-serif" font-size="15" fill="#425563">vs. target</text>
<rect x="70" y="452" width="256" height="62" rx="10" fill="#FFF7F5"/>
<text x="88" y="478" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#E84B37">Context attached automatically</text>
<text x="88" y="500" font-family="Inter,Arial,sans-serif" font-size="13" fill="#425563">Shift · fleet · route · current conditions</text>

<!-- flow arrow -->
<path d="M350 337H407" stroke="#E84B37" stroke-width="8" stroke-linecap="round"/>
<path d="M398 323l18 14-18 14" fill="none" stroke="#E84B37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- role workflow -->
<g filter="url(#shadow)">
  <rect x="420" y="102" width="365" height="470" rx="18" fill="#FFFFFF"/>
</g>
<text x="446" y="138" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#31404A">ROLE-BASED DECISION WORKFLOW</text>

<g font-family="Inter,Arial,sans-serif">
  <rect x="446" y="166" width="313" height="82" rx="12" fill="#F2F2F2"/>
  <circle cx="480" cy="207" r="22" fill="#425563"/><text x="473" y="214" font-size="18" font-weight="800" fill="#fff">1</text>
  <text x="520" y="196" font-size="18" font-weight="800" fill="#212A31">Investigate</text>
  <text x="520" y="220" font-size="14" fill="#425563">Operational review · Operator</text>
  <circle cx="728" cy="207" r="12" fill="#1F9D55"/><path d="M722 207l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6"/>

  <line x1="480" y1="250" x2="480" y2="276" stroke="#839BAC" stroke-width="4"/>
  <path d="M472 269l8 10 8-10" fill="none" stroke="#839BAC" stroke-width="4"/>

  <rect x="446" y="286" width="313" height="82" rx="12" fill="#F2F2F2"/>
  <circle cx="480" cy="327" r="22" fill="#425563"/><text x="473" y="334" font-size="18" font-weight="800" fill="#fff">2</text>
  <text x="520" y="316" font-size="18" font-weight="800" fill="#212A31">Assess impact</text>
  <text x="520" y="340" font-size="14" fill="#425563">SIC analysis · options · Analyst</text>
  <circle cx="728" cy="327" r="12" fill="#1F9D55"/><path d="M722 327l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6"/>

  <line x1="480" y1="370" x2="480" y2="396" stroke="#839BAC" stroke-width="4"/>
  <path d="M472 389l8 10 8-10" fill="none" stroke="#839BAC" stroke-width="4"/>

  <rect x="446" y="406" width="313" height="82" rx="12" fill="#F2F2F2"/>
  <circle cx="480" cy="447" r="22" fill="#E84B37"/><text x="473" y="454" font-size="18" font-weight="800" fill="#fff">3</text>
  <text x="520" y="436" font-size="18" font-weight="800" fill="#212A31">Approve action</text>
  <text x="520" y="460" font-size="14" fill="#425563">Select · authorize · Operations manager</text>
  <circle cx="728" cy="447" r="12" fill="#1F9D55"/><path d="M722 447l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.6"/>

  <rect x="446" y="510" width="313" height="38" rx="19" fill="#FFF7F5" stroke="#E84B37"/>
  <text x="510" y="535" font-size="14" font-weight="700" fill="#E84B37">Escalate only if outside threshold</text>
</g>

<!-- flow arrow -->
<path d="M786 337H840" stroke="#1F9D55" stroke-width="8" stroke-linecap="round"/>
<path d="M831 323l18 14-18 14" fill="none" stroke="#1F9D55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

<!-- outcome -->
<g filter="url(#shadow)">
  <rect x="852" y="116" width="300" height="430" rx="18" fill="#FFFFFF" stroke="#1F9D55" stroke-width="3"/>
</g>
<circle cx="890" cy="168" r="22" fill="#1F9D55"/><path d="M879 168l8 8 15-19" fill="none" stroke="#fff" stroke-width="5"/>
<text x="925" y="160" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#212A31">Action implemented</text>
<text x="925" y="184" font-family="Inter,Arial,sans-serif" font-size="14" fill="#425563">Dispatch plan adjusted</text>

<rect x="876" y="218" width="252" height="102" rx="12" fill="#F2F2F2"/>
<text x="894" y="244" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#425563">Cycle time returning to target</text>
<line x1="894" y1="292" x2="1110" y2="292" stroke="#B1BCC8"/>
<path d="M896 270L924 262 952 268 980 254 1008 260 1036 246 1064 250 1092 238" fill="none" stroke="#1F9D55" stroke-width="4"/>

<text x="876" y="358" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#31404A">AUDIT TRAIL</text>
<line x1="900" y1="384" x2="900" y2="506" stroke="#1F9D55" stroke-width="3"/>
<g font-family="Inter,Arial,sans-serif">
  <circle cx="900" cy="398" r="9" fill="#1F9D55"/><text x="922" y="404" font-size="14" fill="#212A31">10:14 · Deviation detected</text>
  <circle cx="900" cy="434" r="9" fill="#1F9D55"/><text x="922" y="440" font-size="14" fill="#212A31">10:27 · Analysis completed</text>
  <circle cx="900" cy="470" r="9" fill="#1F9D55"/><text x="922" y="476" font-size="14" fill="#212A31">10:41 · Action approved</text>
  <circle cx="900" cy="506" r="9" fill="#1F9D55"/><text x="922" y="512" font-size="14" fill="#212A31">11:05 · Plan implemented</text>
</g>
</svg>