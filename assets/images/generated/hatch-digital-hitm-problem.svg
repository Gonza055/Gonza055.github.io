<path d="M900 258L932 239 964 247 996 214 1028 227 1060 198 1108 210" fill="none" stroke="#E84B37" stroke-width="4"/>
<line x1="900" y1="267" x2="1110" y2="267" stroke="#B1BCC8"/>
<g fill="#425563">
  <rect x="902" y="224" width="10" height="28"/><rect x="920" y="216" width="10" height="36"/>
  <rect x="1080" y="235" width="10" height="17"/><rect x="1098" y="220" width="10" height="32"/>
</g>

<g font-family="Inter,Arial,sans-serif">
