  <text x="500" y="278" font-size="19" font-weight="800" fill="#212A31">Validate &amp; QA/QC</text>
  <text x="500" y="301" font-size="14" fill="#425563">Completeness · ranges · consistency</text>

  <line x1="458" y1="316" x2="458" y2="340" stroke="#839BAC" stroke-width="4"/>
  <path d="M450 333l8 10 8-10" fill="none" stroke="#839BAC" stroke-width="4"/>

  <circle cx="458" cy="378" r="26" fill="#425563"/><text x="449" y="386" font-size="22" font-weight="800" fill="#fff">3</text>
  <text x="500" y="372" font-size="19" font-weight="800" fill="#212A31">Reconcile &amp; integrate</text>
  <text x="500" y="395" font-size="14" fill="#425563">Cross-source alignment · engineering logic</text>

  <line x1="458" y1="410" x2="458" y2="434" stroke="#839BAC" stroke-width="4"/>
  <path d="M450 427l8 10 8-10" fill="none" stroke="#839BAC" stroke-width="4"/>

  <circle cx="458" cy="472" r="26" fill="#425563"/><text x="449" y="480" font-size="22" font-weight="800" fill="#fff">4</text>
  <text x="500" y="466" font-size="19" font-weight="800" fill="#212A31">Transform &amp; structure</text>
  <text x="500" y="489" font-size="14" fill="#425563">Curated · traceable · review-ready</text>

  <rect x="430" y="520" width="320" height="30" rx="15" fill="#F2F2F2"/>
  <circle cx="451" cy="535" r="8" fill="#1F9D55"/>
  <path d="M447 535l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="468" y="541" font-size="14" font-weight="700" fill="#425563">Engineering logic preserved</text>
</g>

<!-- Output dashboard -->
<g filter="url(#shadow)">
  <rect x="858" y="102" width="294" height="470" rx="18" fill="#FFFFFF" stroke="#D6DEE3"/>
</g>
<text x="882" y="137" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#31404A">ENGINEERING-READY DATA</text>
<rect x="882" y="165" width="246" height="128" rx="12" fill="#F2F2F2" stroke="#D6DEE3"/>
