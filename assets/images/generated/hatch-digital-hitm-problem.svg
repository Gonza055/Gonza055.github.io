<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">HITM data preparation workflow</title>
<desc id="desc">Technical inputs are standardized, validated, reconciled and transformed into engineering-ready HITM data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7F8F9"/><stop offset="1" stop-color="#D6DEE3"/>
  </linearGradient>
  <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B1BCC8" stop-opacity=".55"/><stop offset="1" stop-color="#839BAC" stop-opacity=".18"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#212A31" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<path d="M0 270L115 228 220 247 330 207 430 235 540 190 655 230 760 205 875 238 990 205 1200 250V675H0Z" fill="url(#mine)"/>
<path d="M0 355c140-38 222-20 345 8 125 29 234 42 380 15 171-31 286-25 475 18" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3"/>
<text x="52" y="58" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#E84B37">HITM</text>
<text x="128" y="58" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#212A31">DATA PREPARATION</text>

