  <text x="896" y="340" font-size="13" fill="#425563">Valid records</text>
  <text x="896" y="370" font-size="27" font-weight="800" fill="#212A31">92.4%</text>
  <circle cx="980" cy="352" r="12" fill="#1F9D55"/><path d="M974 352l4 4 8-10" fill="none" stroke="#fff" stroke-width="3"/>

  <rect x="1010" y="314" width="118" height="78" rx="10" fill="#F2F2F2"/>
  <text x="1024" y="340" font-size="13" fill="#425563">QC issues</text>
  <text x="1024" y="370" font-size="27" font-weight="800" fill="#E84B37">245</text>

  <rect x="882" y="408" width="246" height="58" rx="10" fill="#F2F2F2"/>
  <text x="900" y="433" font-size="14" font-weight="700" fill="#212A31">Validated HITM dataset</text>
  <text x="900" y="454" font-size="13" fill="#425563">Consistent · traceable · documented</text>
  <circle cx="1102" cy="437" r="14" fill="#1F9D55"/><path d="M1095 437l5 5 9-12" fill="none" stroke="#fff" stroke-width="3"/>

  <rect x="882" y="482" width="246" height="58" rx="10" fill="#FFF7F5" stroke="#E84B37"/>
  <text x="900" y="508" font-size="14" font-weight="700" fill="#E84B37">Ready for review / upload</text>
  <text x="900" y="529" font-size="13" fill="#425563">No engineering logic lost</text>
</g>
