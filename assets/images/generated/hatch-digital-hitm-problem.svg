  <rect x="72" y="272" width="236" height="86" rx="12" fill="#F2F2F2" stroke="#B1BCC8"/>
  <circle cx="105" cy="314" r="20" fill="#425563"/>
  <path d="M95 316l8-9 8 6 8-13" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="140" y="303" font-size="17" font-weight="700" fill="#212A31">Monitoring data</text>
  <text x="140" y="326" font-size="14" fill="#425563">Levels · flows · pressures</text>

  <rect x="72" y="378" width="236" height="86" rx="12" fill="#F2F2F2" stroke="#B1BCC8"/>
  <ellipse cx="105" cy="406" rx="20" ry="8" fill="#31404A"/>
  <rect x="85" y="406" width="40" height="23" fill="#31404A"/>
  <ellipse cx="105" cy="429" rx="20" ry="8" fill="#425563"/>
  <text x="140" y="409" font-size="17" font-weight="700" fill="#212A31">Facility readings</text>
  <text x="140" y="432" font-size="14" fill="#425563">TSF · water · deposition</text>

  <rect x="72" y="484" width="236" height="62" rx="12" fill="#FFF7F5" stroke="#E84B37"/>
  <text x="92" y="510" font-size="16" font-weight="700" fill="#E84B37">Engineering context</text>
  <text x="92" y="532" font-size="13" fill="#425563">Units · notes · assumptions</text>
</g>

<!-- Flow arrows -->
<path d="M334 337H391" stroke="#E84B37" stroke-width="8" stroke-linecap="round"/>
<path d="M382 323l18 14-18 14" fill="none" stroke="#E84B37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M790 337H845" stroke="#E84B37" stroke-width="8" stroke-linecap="round"/>
<path d="M836 323l18 14-18 14" fill="none" stroke="#E84B37" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

