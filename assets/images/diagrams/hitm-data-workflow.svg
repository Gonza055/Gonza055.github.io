<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="78" fill="#2563eb" font-size="22" font-weight="700">DATA AUTOMATION</text><text x="72" y="132" fill="#0f172a" font-size="42" font-weight="700">Automation does not remove validation</text><text x="72" y="172" fill="#64748b" font-size="20">The pipeline is useful only if the technical logic remains visible and reviewable.</text><g transform="translate(95 245)" text-anchor="middle"><g fill="#fff" stroke="#e2e8f0" stroke-width="2"><rect x="0" y="0" width="210" height="145" rx="18"/><rect x="270" y="0" width="210" height="145" rx="18"/><rect x="540" y="0" width="210" height="145" rx="18"/><rect x="810" y="0" width="210" height="145" rx="18"/></g><g fill="#2563eb" font-size="15" font-weight="700"><text x="105" y="35">01</text><text x="375" y="35">02</text><text x="645" y="35">03</text><text x="915" y="35">04</text></g><g fill="#0f172a" font-size="23" font-weight="700"><text x="105" y="79">Receive</text><text x="375" y="79">Prepare</text><text x="645" y="79">Validate</text><text x="915" y="79">Generate output</text></g><g fill="#64748b" font-size="15"><text x="105" y="112">technical source files</text><text x="375" y="112">structure &amp; formats</text><text x="645" y="112">rules &amp; exceptions</text><text x="915" y="112">reviewable data</text></g><g fill="#94a3b8" font-size="34"><text x="240" y="83">→</text><text x="510" y="83">→</text><text x="780" y="83">→</text></g></g><text x="600" y="468" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Reliable automation = repeatable transformation + explicit engineering checks</text></g></svg>