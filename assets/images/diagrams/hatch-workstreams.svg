<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="76" fill="#2563eb" font-size="22" font-weight="700">HATCH DIGITAL · THREE WORKSTREAMS</text><text x="70" y="130" fill="#0f172a" font-size="42" font-weight="700">Measure. Validate. Support the decision.</text><text x="70" y="170" fill="#64748b" font-size="20">Different tools, one operating principle.</text><g transform="translate(85 235)"><rect x="0" y="0" width="300" height="225" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="365" y="0" width="300" height="225" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="730" y="0" width="300" height="225" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="28" y="43" fill="#2563eb" font-size="15" font-weight="700">01 · DRONES</text><text x="28" y="82" fill="#0f172a" font-size="24" font-weight="700">Reliable measurement</text><text x="28" y="118" fill="#64748b" font-size="15">Reference geometry, reconstruction,</text><text x="28" y="142" fill="#64748b" font-size="15">validation, and confidence.</text><text x="393" y="43" fill="#2563eb" font-size="15" font-weight="700">02 · HITM</text><text x="393" y="82" fill="#0f172a" font-size="24" font-weight="700">Reliable data</text><text x="393" y="118" fill="#64748b" font-size="15">Structure files, preserve rules,</text><text x="393" y="142" fill="#64748b" font-size="15">make outputs reviewable.</text><text x="758" y="43" fill="#2563eb" font-size="15" font-weight="700">03 · SIC</text><text x="758" y="82" fill="#0f172a" font-size="24" font-weight="700">Reliable response</text><text x="758" y="118" fill="#64748b" font-size="15">Detect deviation, assess impact,</text><text x="758" y="142" fill="#64748b" font-size="15">assign action, verify and learn.</text></g><rect x="85" y="500" width="1030" height="65" rx="16" fill="#0f172a"/><text x="600" y="541" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Define the decision first → determine the information it needs → make validation explicit</text></g></svg>