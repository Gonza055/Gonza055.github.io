<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Hybrid measurement architecture</title><desc id="desc">A generalized workflow from fixed capture and aerial reference through cycle data, edge processing, validation, and an operational decision per cycle.</desc><rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="72" y="78" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MEASUREMENT ARCHITECTURE</text><text x="72" y="132" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">From capture to a defensible decision per cycle</text><text x="72" y="174" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="21">Independent reference + cycle context + local processing + validation</text><g font-family="Inter,Arial,sans-serif"><g transform="translate(72 235)"><rect width="160" height="172" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="80" cy="52" r="25" fill="#eff6ff"/><path d="M62 48h36v24H62z M68 42h24l7 6H61z" fill="none" stroke="#2563eb" stroke-width="4"/><text x="80" y="112" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Fixed capture</text><text x="80" y="140" text-anchor="middle" fill="#64748b" font-size="14">Continuous</text></g><text x="248" y="325" fill="#94a3b8" font-size="34">→</text><g transform="translate(285 235)"><rect width="160" height="172" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="80" cy="52" r="25" fill="#eff6ff"/><path d="M55 50h50M63 43l-9 7 9 7M97 43l9 7-9 7M80 35v30" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="80" y="112" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Aerial reference</text><text x="80" y="140" text-anchor="middle" fill="#64748b" font-size="14">Geometry &amp; audit</text></g><text x="461" y="325" fill="#94a3b8" font-size="34">→</text><g transform="translate(498 235)"><rect width="160" height="172" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="80" cy="52" r="25" fill="#eff6ff"/><path d="M65 36h30v32H65zM70 44h20M70 52h20M70 60h14" fill="none" stroke="#2563eb" stroke-width="4"/><text x="80" y="112" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Cycle data</text><text x="80" y="140" text-anchor="middle" fill="#64748b" font-size="14">Payload &amp; context</text></g><text x="674" y="325" fill="#94a3b8" font-size="34">→</text><g transform="translate(711 235)"><rect width="160" height="172" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="80" cy="52" r="25" fill="#eff6ff"/><path d="M61 42h38v24H61zM68 34v8M80 34v8M92 34v8" fill="none" stroke="#2563eb" stroke-width="4"/><text x="80" y="112" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Edge processing</text><text x="80" y="140" text-anchor="middle" fill="#64748b" font-size="14">Local inference</text></g><text x="887" y="325" fill="#94a3b8" font-size="34">→</text><g transform="translate(924 235)"><rect width="204" height="172" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="102" cy="52" r="25" fill="#eff6ff"/><path d="M89 52l9 9 19-23" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="108" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Reconcile &amp; validate</text><text x="102" y="137" text-anchor="middle" fill="#64748b" font-size="14">Rules + uncertainty</text></g><rect x="72" y="462" width="1056" height="86" rx="18" fill="#0f172a"/><text x="600" y="499" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Operational output</text><text x="600" y="530" text-anchor="middle" fill="#cbd5e1" font-size="17">A traceable recommendation per cycle — with confidence and conditions for use</text></g></svg>