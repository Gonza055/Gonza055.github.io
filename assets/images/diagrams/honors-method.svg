<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="72" y="78" fill="#2563eb" font-size="22" font-weight="700">ANALYTICAL WORKFLOW</text><text x="72" y="132" fill="#0f172a" font-size="42" font-weight="700">From process history to interpretable regimes</text><text x="72" y="172" fill="#64748b" font-size="20">Keep process behavior and KPI context separate during modeling, then reconnect them for interpretation.</text><g transform="translate(55 245)" text-anchor="middle"><g fill="#fff" stroke="#e2e8f0" stroke-width="2"><rect x="0" y="0" width="160" height="145" rx="18"/><rect x="185" y="0" width="160" height="145" rx="18"/><rect x="370" y="0" width="160" height="145" rx="18"/><rect x="555" y="0" width="160" height="145" rx="18"/><rect x="740" y="0" width="160" height="145" rx="18"/><rect x="925" y="0" width="160" height="145" rx="18"/></g><g fill="#0f172a" font-size="18" font-weight="700"><text x="80" y="61"><tspan x="80">Minute-level</tspan><tspan x="80" dy="23">process data</tspan></text><text x="265" y="61"><tspan x="265">Daily KPI</tspan><tspan x="265" dy="23">context</tspan></text><text x="450" y="72">Scale</text><text x="635" y="72">PCA</text><text x="820" y="72">DBSCAN</text><text x="1005" y="61"><tspan x="1005">Profile &amp;</tspan><tspan x="1005" dy="23">interpret</tspan></text></g><g fill="#64748b" font-size="13"><text x="80" y="117">feature space</text><text x="265" y="117">interpretive layer</text><text x="450" y="117">standardize</text><text x="635" y="117">95% variance</text><text x="820" y="117">dense structures</text><text x="1005" y="117">business value</text></g></g><text x="600" y="468" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Output: recurring modes that can be discussed in engineering and performance terms</text></g></svg>