<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="76" fill="#2563eb" font-size="22" font-weight="700">WILDFIRE PREDICTION · BYU</text><text x="70" y="130" fill="#0f172a" font-size="42" font-weight="700">Use ML to narrow where to look first</text><text x="70" y="170" fill="#64748b" font-size="20">A prioritization workflow, not a claim of complete wildfire detection.</text><g transform="translate(55 230)" text-anchor="middle"><g fill="#fff" stroke="#e2e8f0" stroke-width="2"><rect x="0" y="0" width="190" height="170" rx="18"/><rect x="220" y="0" width="190" height="170" rx="18"/><rect x="440" y="0" width="190" height="170" rx="18"/><rect x="660" y="0" width="190" height="170" rx="18"/><rect x="880" y="0" width="190" height="170" rx="18"/></g><g fill="#2563eb" font-size="14" font-weight="700"><text x="95" y="34">01</text><text x="315" y="34">02</text><text x="535" y="34">03</text><text x="755" y="34">04</text><text x="975" y="34">05</text></g><g fill="#0f172a" font-size="18" font-weight="700"><text x="95" y="67"><tspan x="95">7-day weather</tspan><tspan x="95" dy="22">history</tspan></text><text x="315" y="67"><tspan x="315">Fire / non-fire</tspan><tspan x="315" dy="22">examples</tspan></text><text x="535" y="67"><tspan x="535">Compare ML</tspan><tspan x="535" dy="22">models</tspan></text><text x="755" y="67"><tspan x="755">Rank high-risk</tspan><tspan x="755" dy="22">locations</tspan></text><text x="975" y="67"><tspan x="975">Map + retrieve</tspan><tspan x="975" dy="22">imagery</tspan></text></g><g fill="#64748b" font-size="13"><text x="95" y="128">Meteostat</text><text x="315" y="128">Utah history</text><text x="535" y="128">XGB · RF · NB</text><text x="755" y="128">prioritize</text><text x="975" y="128">user workflow</text></g></g><g><rect x="70" y="455" width="320" height="85" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="95" y="489" fill="#0f172a" font-size="25" font-weight="700">23%</text><text x="95" y="516" fill="#64748b" font-size="14">precision</text><rect x="440" y="455" width="320" height="85" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="465" y="489" fill="#0f172a" font-size="25" font-weight="700">9.7%</text><text x="465" y="516" fill="#64748b" font-size="14">recall</text><rect x="810" y="455" width="320" height="85" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="835" y="489" fill="#0f172a" font-size="25" font-weight="700">0.110 PR AUC</text><text x="835" y="516" fill="#64748b" font-size="14">vs 0.006 random baseline (~18×)</text></g></g></svg>