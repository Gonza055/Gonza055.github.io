name: Build and Deploy Jekyll with Minimal Mistakes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Dependencies
        run: bundle install

      - name: Generate portfolio assets
        run: |
          python -m pip install --quiet pillow reportlab
          python scripts/generate_social_previews.py
          python scripts/generate_resume_pdf.py
          mkdir -p assets/images/real
          unzip -o scripts/portfolio-real-assets.zip -d assets/images/real

      - name: Build Site
        run: bundle exec jekyll build -d _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
