name: Build and Deploy Jekyll with Minimal Mistakes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Dependencies
        run: bundle install

      - name: Generate social preview images
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_social_previews.py

      - name: Build Site
        run: bundle exec jekyll build -d _site --config _config.yml,_config_social.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
