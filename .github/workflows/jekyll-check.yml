name: Validate Jekyll Site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - portfolio-refresh-2026

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace
