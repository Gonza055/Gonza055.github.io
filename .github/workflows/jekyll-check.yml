name: Validate Jekyll Site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - portfolio-refresh-2026

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Generate portfolio assets
        run: |
          python -m pip install --quiet pillow reportlab
          python scripts/generate_social_previews.py
          python scripts/generate_resume_pdf.py
          mkdir -p assets/images/real
          unzip -o scripts/portfolio-real-assets.zip -d assets/images/real

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Upload built site for QA
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-preview
          path: _site
          retention-days: 7
