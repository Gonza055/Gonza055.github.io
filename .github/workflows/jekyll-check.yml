name: Validate Jekyll Site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - portfolio-refresh-2026

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Generate social preview images
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_social_previews.py

      - name: Build site
        run: bundle exec jekyll build --trace --config _config.yml,_config_social.yml

      - name: Upload built site for QA
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-preview
          path: _site
          retention-days: 7
